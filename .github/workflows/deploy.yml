name: Deploy ITSM

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'screenshots/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer name (or "all" for all customers)'
        required: false
        default: 'vgc'
      skip_build:
        description: 'Skip frontend build'
        required: false
        default: 'false'

env:
  NODE_VERSION: '22'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --production=false
      - name: Syntax check server
        run: node -c server.js
      - name: Lint
        run: npx eslint . --max-warnings 3000
      - name: Unit tests
        run: npm test
      - name: Stamp build metadata
        run: |
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('VERSION.json','utf8'));
            v.gitSha = '${{ github.sha }}'.slice(0,8);
            v.buildDate = new Date().toISOString().slice(0,10);
            v.buildNumber = '${{ github.run_number }}';
            fs.writeFileSync('VERSION.json', JSON.stringify(v, null, 2) + '\n');
          "
      - name: Build frontend
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: npx vite build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            VERSION.json
          retention-days: 7

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy all server files to staging slot
        env:
          DEPLOY_CREDS: ${{ secrets.KUDU_CREDENTIALS }}
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
        run: |
          CRED=$(echo -n "$DEPLOY_CREDS" | base64)
          SLOT_SCM="https://${APP_NAME}-staging.scm.azurewebsites.net"

          upload() {
            local remote="$1" local_file="$2"
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/${remote}" \
              -H "Authorization: Basic ${CRED}" -H "If-Match: *" \
              --data-binary @"$local_file" && echo "  ✓ ${remote}" || echo "  ✗ ${remote}"
          }

          # Server core files
          SERVER_FILES="server.js authMiddleware.js cacheLayer.js graphService.js msalConfig.js
            notificationEngine.js slaEngine.js workflowEngine.js analyticsEngine.js wsServer.js
            featureFlags.js piiRedact.js shadowMode.js shadowWorkflow.js incidentIndex.js cluster.js"
          echo "Uploading server files..."
          for f in $SERVER_FILES; do
            [ -f "$f" ] && upload "$f" "$f"
          done

          # Route handlers — ensure routes/ directory exists
          curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/routes/" \
            -H "Authorization: Basic ${CRED}" || true
          echo "Uploading route files..."
          for f in routes/*.js; do
            [ -f "$f" ] && upload "$f" "$f"
          done
          # Upload nested route dirs (e.g. routes/ai/)
          if [ -d "routes/ai" ]; then
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/routes/ai/" \
              -H "Authorization: Basic ${CRED}" || true
            for f in routes/ai/*.js; do
              [ -f "$f" ] && upload "$f" "$f"
            done
          fi

          # Config files
          for f in profiles.json sw_clients.xml kb-enterprise-articles.json; do
            [ -f "$f" ] && upload "$f" "$f"
          done

          # VERSION.json (from build artifact)
          upload "VERSION.json" "dist/VERSION.json"

          # Frontend assets
          upload "index.html" "dist/index.html"
          for f in dist/assets/*.js; do
            fname=$(basename "$f")
            upload "assets/${fname}" "$f"
          done

          # i18n translation files (if present)
          if [ -d "src/i18n" ]; then
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/i18n/" \
              -H "Authorization: Basic ${CRED}" || true
            for f in src/i18n/*.json; do
              [ -f "$f" ] && upload "i18n/$(basename $f)" "$f"
            done
          fi

          echo "Staging deployment complete"

      - name: Smoke test staging
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
        run: |
          STAGING_URL="https://${APP_NAME}-staging.azurewebsites.net"
          sleep 10
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Staging attempt $i: HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Staging health check failed"
          exit 1

  deploy:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy all server files to staging slot
        env:
          DEPLOY_CREDS: ${{ secrets.KUDU_CREDENTIALS }}
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
        run: |
          CRED=$(echo -n "$DEPLOY_CREDS" | base64)
          SLOT_SCM="https://${APP_NAME}-staging.scm.azurewebsites.net"

          upload() {
            local remote="$1" local_file="$2"
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/${remote}" \
              -H "Authorization: Basic ${CRED}" -H "If-Match: *" \
              --data-binary @"$local_file" && echo "  ✓ ${remote}" || echo "  ✗ ${remote}"
          }

          # Clean old JS bundles in staging
          curl -s "${SLOT_SCM}/api/vfs/site/wwwroot/assets/" \
            -H "Authorization: Basic ${CRED}" | \
            jq -r '.[]? | select(.name | endswith(".js")) | .name' 2>/dev/null | \
            while read f; do
              curl -s -X DELETE "${SLOT_SCM}/api/vfs/site/wwwroot/assets/${f}" \
                -H "Authorization: Basic ${CRED}" -H "If-Match: *"
            done

          # Server core files
          SERVER_FILES="server.js authMiddleware.js cacheLayer.js graphService.js msalConfig.js
            notificationEngine.js slaEngine.js workflowEngine.js analyticsEngine.js wsServer.js
            featureFlags.js piiRedact.js shadowMode.js shadowWorkflow.js incidentIndex.js cluster.js"
          echo "Uploading server files..."
          for f in $SERVER_FILES; do
            [ -f "$f" ] && upload "$f" "$f"
          done

          # Route handlers
          curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/routes/" \
            -H "Authorization: Basic ${CRED}" || true
          for f in routes/*.js; do
            [ -f "$f" ] && upload "$f" "$f"
          done
          if [ -d "routes/ai" ]; then
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/routes/ai/" \
              -H "Authorization: Basic ${CRED}" || true
            for f in routes/ai/*.js; do
              [ -f "$f" ] && upload "$f" "$f"
            done
          fi

          # Config + frontend
          for f in profiles.json sw_clients.xml kb-enterprise-articles.json; do
            [ -f "$f" ] && upload "$f" "$f"
          done
          upload "VERSION.json" "dist/VERSION.json"
          upload "index.html" "dist/index.html"
          for f in dist/assets/*.js; do
            fname=$(basename "$f")
            upload "assets/${fname}" "$f"
          done

          # i18n translation files
          if [ -d "src/i18n" ]; then
            curl -sf -X PUT "${SLOT_SCM}/api/vfs/site/wwwroot/i18n/" \
              -H "Authorization: Basic ${CRED}" || true
            for f in src/i18n/*.json; do
              [ -f "$f" ] && upload "i18n/$(basename $f)" "$f"
            done
          fi

          echo "Staging pre-swap deployment complete"

      - name: Smoke test staging before swap
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
        run: |
          STAGING_URL="https://${APP_NAME}-staging.azurewebsites.net"
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed — ready for swap"
              exit 0
            fi
            echo "Staging attempt $i: HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Staging health check failed — aborting swap"
          exit 1

      - name: Swap staging to production
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
          RG_NAME: ${{ secrets.RG_NAME || 'vgc-itsm-1-RG' }}
        run: |
          echo "Swapping staging → production..."
          az webapp deployment slot swap \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME" \
            --slot staging \
            --target-slot production
          echo "Swap complete"

      - name: Health check production
        id: health_check
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_NAME}.azurewebsites.net/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed (attempt $i)"
              curl -s "https://${APP_NAME}.azurewebsites.net/api/health" | jq .
              exit 0
            fi
            echo "Health check attempt $i: HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Production health check FAILED after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health_check.outcome == 'failure'
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'vgc-itsm1-app' }}
          RG_NAME: ${{ secrets.RG_NAME || 'vgc-itsm-1-RG' }}
        run: |
          echo "⚠️ Rolling back — swapping production → staging..."
          az webapp deployment slot swap \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME" \
            --slot staging \
            --target-slot production
          echo "Rollback complete — previous version restored"
