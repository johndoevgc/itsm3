<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VGC Technology ITSM — IT Service Management Platform with AI-powered triage, SLA monitoring, and Zendesk integration." />
    <meta name="theme-color" content="#080a12" />
    <title>VGC-ITSM</title>
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #080a12;
      }

      /* Prevent layout shift: reserve space while JS loads */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid #27272A;
        border-top-color: #818CF8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="color:#A1A1AA;padding:40px;font-family:sans-serif;text-align:center;background:#080a12;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <p>JavaScript is required to run VGC-ITSM. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
